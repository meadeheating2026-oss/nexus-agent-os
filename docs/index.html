    async function sha256Hex(text) {
      const buf = new TextEncoder().encode('nexus_salt_2026::' + text);
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function randHex(len = 16) {
      const arr = new Uint8Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function currentUser() {
      if (!state.session_user_id) return null;
      return state.users.find(u => u.id === state.session_user_id && u.is_active) || null;
    }

    function userPlan(u) {
      if (!u) return DEFAULT_PLANS[0];
      if (u.role === 'super_admin') return state.plans[3];
      return state.plans.find(p => p.id === u.plan_id) || state.plans[0];
    }

    function effectiveLlm(u) {
      if (u && state.config.allow_byok && u.byok_key && u.byok_key.trim().length > 8) {
        return { provider: u.byok_provider || 'gemini', key: u.byok_key.trim(), isByok: true };
      }
      if (state.config.api_key && state.config.api_key.trim().length > 8) {
        return { provider: state.config.provider || 'gemini', key: state.config.api_key.trim(), isByok: false };
      }
      return null;
    }

    function flash(notice = '', error = '') {
      ui.notice = notice;
      ui.error = error;
      render();
    }

    function esc(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ==================== SAFE REAL TOOLS ====================
    function safeMathEval(expr) {
      const cleaned = String(expr || '').replace(/\^/g, '**').trim();
      if (!/^[0-9+\-*/().,%\s*a-zA-Z_]+$/.test(cleaned)) {
        return 'خطأ: تعبير رياضي غير مسموح به أمنياً.';
      }
      const allowed = {
        abs: Math.abs, round: Math.round, min: Math.min, max: Math.max,
        pow: Math.pow, sqrt: Math.sqrt, log: Math.log, exp: Math.exp,
        floor: Math.floor, ceil: Math.ceil, PI: Math.PI, E: Math.E
      };
      const keys = Object.keys(allowed);
      const vals = Object.values(allowed);
      try {
        const fn = new Function(...keys, '"use strict"; return (' + cleaned + ');');
        const res = fn(...vals);
        return JSON.stringify({ expression: expr, result: res });
      } catch (err) {
        return 'خطأ في الحساب: ' + err.message;
      }
    }

    async function executeToolCall(u, agent, toolName, args, depth) {
      if (toolName === 'python_eval') {
        return safeMathEval(args.expression || '');
      }
      if (toolName === 'memory_kv') {
        const bucketKey = u.id + '::' + (args.key || 'default');
        if (args.action === 'write') {
          state.memories[bucketKey] = String(args.value || '');
          saveStore();
          return JSON.stringify({ stored: true, key: args.key, value: state.memories[bucketKey] });
        }
        return JSON.stringify({ key: args.key, value: state.memories[bucketKey] || null });
      }
      if (toolName === 'delegate_to_colleague' && depth < 1) {
        const target = state.agents.find(a => a.user_id === u.id && a.id === Number(args.colleague_agent_id));
        if (!target) return 'الوكيل الزميل غير موجود في مساحتك.';
        const sub = await runReActAgent(u, target, String(args.sub_task || ''), [], depth + 1);
        return `[مخرجات الزميل ${target.name}]:\n${sub.text}`;
      }
      const custom = state.custom_tools.find(t => t.user_id === u.id && t.slug === toolName);
      if (custom) {
        try {
          const opts = { method: custom.method || 'POST', headers: { 'Content-Type': 'application/json' } };
          if (opts.method !== 'GET') opts.body = JSON.stringify(args || {});
          const r = await fetch(custom.url, opts);
          const txt = await r.text();
          return txt.slice(0, 2000);
        } catch (e) {
          return 'فشل الاتصال بنقطة HTTP الخارجية: ' + e.message;
        }
      }
      return 'أداة غير معروفة: ' + toolName;
    }

    function buildOpenAiToolsSchema(u, agent, allowDelegate) {
      const schemas = [];
      for (const slug of (agent.tools || [])) {
        if (slug === 'python_eval') {
          schemas.push({
            type: 'function',
            function: {
              name: 'python_eval',
              description: 'حاسبة رياضية ومالية دقيقة لحساب النسب والعوائد والتدفقات النقدية.',
              parameters: {
                type: 'object',
                properties: { expression: { type: 'string', description: 'التعبير الرياضي مثل 250000 * pow(1.12, 3)' } },
                required: ['expression']
              }
            }
          });
        } else if (slug === 'memory_kv') {
          schemas.push({
            type: 'function',
            function: {
              name: 'memory_kv',
              description: 'قراءة أو كتابة معلومة في الذاكرة الدائمة للوكيل.',
              parameters: {
                type: 'object',
                properties: {
                  action: { type: 'string', enum: ['read', 'write'] },
                  key: { type: 'string' },
                  value: { type: 'string' }
                },
                required: ['action', 'key']
              }
            }
          });
        } else {
          const ct = state.custom_tools.find(t => t.user_id === u.id && t.slug === slug);
          if (ct) {
            schemas.push({
              type: 'function',
              function: {
                name: ct.slug,
                description: ct.description || ct.name,
                parameters: { type: 'object', properties: { payload: { type: 'string' } } }
              }
            });
          }
        }
      }
      if (allowDelegate && agent.can_delegate) {
        const peers = state.agents.filter(a => a.user_id === u.id && a.id !== agent.id);
        if (peers.length > 0) {
          const peerDesc = peers.map(p => `${p.id}: ${p.name} (${p.domain})`).join(' | ');
          schemas.push({
            type: 'function',
            function: {
              name: 'delegate_to_colleague',
              description: 'تفويض مهمة فرعية لزميل متخصص في نفس مساحة العمل: ' + peerDesc,
              parameters: {
                type: 'object',
                properties: {
                  colleague_agent_id: { type: 'integer', description: 'معرف الزميل الرقمي' },
                  sub_task: { type: 'string', description: 'المهمة الفرعية المطلوبة بدقة' }
                },
                required: ['colleague_agent_id', 'sub_task']
              }
            }
          });
        }
      }
      return schemas;
    }

    async function callProviderChat(llm, modelName, messages, toolsSchema) {
      let url = 'https://openrouter.ai/api/v1/chat/completions';
      let resolvedModel = modelName || 'google/gemini-2.5-flash';
      if (llm.provider === 'gemini') {
        url = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';
        resolvedModel = resolvedModel.includes('/') ? resolvedModel.split('/').pop() : resolvedModel;
        if (!resolvedModel.startsWith('gemini')) resolvedModel = 'gemini-2.5-flash';
      } else if (llm.provider === 'openai') {
        url = 'https://api.openai.com/v1/chat/completions';
        resolvedModel = resolvedModel.includes('gpt') ? resolvedModel.replace('openai/', '') : 'gpt-4o-mini';
      }

      const body = { model: resolvedModel, messages, temperature: 0.35 };
      if (toolsSchema && toolsSchema.length > 0) {
        body.tools = toolsSchema;
        body.tool_choice = 'auto';
      }

      const res = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + llm.key
        },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`خطأ من مزود النموذج (${res.status}): ${errText.slice(0, 220)}`);
      }
      return await res.json();
    }

    async function runReActAgent(u, agent, promptText, traceSteps, depth = 0) {
      const llm = effectiveLlm(u);
      if (!llm) throw new Error('لم يتم ربط مفتاح API بعد. اربط مفتاح Gemini أو OpenRouter أو OpenAI أولاً.');

      const toolsSchema = buildOpenAiToolsSchema(u, agent, depth === 0);
      const messages = [
        { role: 'system', content: `${agent.system_prompt}\n\nاسمك: ${agent.name} | تخصصك: ${agent.domain}` },
        { role: 'user', content: promptText }
      ];

      let promptTokens = 0;
      let completionTokens = 0;

      for (let iter = 0; iter < 4; iter++) {
        const t0 = performance.now();
        const data = await callProviderChat(llm, agent.model, messages, toolsSchema);
        const dt = Math.round(performance.now() - t0);
        promptTokens += Number(data?.usage?.prompt_tokens || 120);
        completionTokens += Number(data?.usage?.completion_tokens || 180);

        const msg = data?.choices?.[0]?.message;
        if (!msg) throw new Error('استجابة فارغة من النموذج.');

        if (msg.tool_calls && msg.tool_calls.length > 0) {
          messages.push(msg);
          for (const tc of msg.tool_calls) {
            const fnName = tc.function?.name || '';
            let parsedArgs = {};
            try { parsedArgs = JSON.parse(tc.function?.arguments || '{}'); } catch (_) {}
            const tTool = performance.now();
            const toolOut = await executeToolCall(u, agent, fnName, parsedArgs, depth);
            const dtTool = Math.round(performance.now() - tTool);
            traceSteps.push({
              agent_name: agent.name,
              kind: fnName === 'delegate_to_colleague' ? 'delegation' : 'tool_call',
              tool_name: fnName,
              input: JSON.stringify(parsedArgs),
              output: toolOut,
              ms: dtTool
            });
            messages.push({
              role: 'tool',
              tool_call_id: tc.id,
              content: String(toolOut)
            });
          }
          continue;
        }

        const finalContent = msg.content || '';
        traceSteps.push({
          agent_name: agent.name,
          kind: 'final_answer',
          tool_name: '',
          input: promptText.slice(0, 140),
          output: finalContent.slice(0, 300),
          ms: dt
        });
        agent.runs = (agent.runs || 0) + 1;
        agent.tokens = (agent.tokens || 0) + promptTokens + completionTokens;
        return { text: finalContent, promptTokens, completionTokens, isByok: llm.isByok };
      }
      return { text: 'اكتمل الحد الأقصى لحلقات الاستدلال.', promptTokens, completionTokens, isByok: llm.isByok };
    }

      const myCount = state.agents.filter(a => a.user_id === u.id).length;
      if (u.role !== 'super_admin' && p.max_agents >= 0 && myCount >= p.max_agents) {

        role_title: tpl.role_title,

    window.createCustomAgent = (ev) => {
      ev.preventDefault();
      const u = currentUser();

    window.launchMission = async (ev) => {
      ev.preventDefault();
      const u = currentUser();
      const p = userPlan(u);
      const goal = document.getElementById('mission_goal').value.trim();
      if (!goal) return flash('', 'اكتب الهدف التنفيذي للمهمة أولاً.');

      const myAgents = state.agents.filter(a => a.user_id === u.id);
      const chosen = myAgents.filter(a => ui.selectedAgentIds.includes(a.id));
      if (chosen.length === 0) return flash('', 'اختر وكيلاً واحداً على الأقل لتشغيل المهمة.');

      if (ui.missionMode !== 'standalone' && u.role !== 'super_admin' && !p.allow_swarm) {
        return flash('', 'تشغيل فرق السرب المتكاملة (Swarm) متاح بدءاً من باقة المحترفين (Pro Builder). استخدم كود PRO2026 أو قم بالترقية.');
      }
      if (u.role !== 'super_admin' && u.credits <= 1) {
        return flash('', 'رصيد نقاطك غير كافٍ لتشغيل المهمة. اشحن رصيدك أو استبدل قسيمة.');
      }

      ui.busy = true;
      ui.error = '';
      ui.notice = 'جارٍ الاتصال الفعلي بالنموذج وتنفيذ حلقات الاستدلال والأدوات (ReAct)...';
      render();

      const traceSteps = [];
      let totalPrompt = 0;
      let totalComp = 0;
      let finalOut = '';
      let usedByok = false;

      try {
        if (ui.missionMode === 'standalone') {
          const r = await runReActAgent(u, chosen[0], goal, traceSteps, 0);
          finalOut = r.text;
          totalPrompt += r.promptTokens;
          totalComp += r.completionTokens;
          usedByok = r.isByok;
        } else {
          let handoffContext = `الهدف الرئيسي للعميل:\n${goal}\n`;
          const sections = [];
          for (let i = 0; i < chosen.length; i++) {
            const ag = chosen[i];
            const promptForStage = i === 0
              ? goal
              : `${handoffContext}\n\nبصفتك (${ag.name} - ${ag.domain})، ابنِ على مخرجات زملائك السابقة وأضف مساهمتك التخصصية الدقيقة:`;
            const r = await runReActAgent(u, ag, promptForStage, traceSteps, 0);
            totalPrompt += r.promptTokens;
            totalComp += r.completionTokens;
            usedByok = r.isByok;
            sections.push(`### [${i + 1}] ${ag.name} (${ag.domain})\n${r.text}`);
            handoffContext += `\n---\nمخرجات ${ag.name}:\n${r.text}\n`;
          }
          finalOut = sections.join('\n\n---\n\n');
        }

        const apiCostUsd = ((totalPrompt * 0.0003) + (totalComp * 0.0012)) / 1000;
        const markup = Number(state.config.markup_multiplier || 4.0);
        const creditsCharged = (u.role === 'super_admin' || usedByok)
          ? 0
          : Math.max(1, Number(((apiCostUsd * markup) * 1000).toFixed(2)));
        const profitUsd = usedByok || u.role === 'super_admin' ? 0 : Math.max(0, (creditsCharged / 1000) - apiCostUsd);

        if (creditsCharged > 0) {
          u.credits = Math.max(0, Number((u.credits - creditsCharged).toFixed(2)));
          u.spent_credits = Number((u.spent_credits + creditsCharged).toFixed(2));
          state.txs.unshift({
            id: Date.now(),
            user_id: u.id,
            type: 'mission_usage',
            delta: -creditsCharged,
            balance_after: u.credits,
            api_cost_usd: apiCostUsd,
            profit_usd: profitUsd,
            note: `تشغيل مهمة (${ui.missionMode}) — ${totalPrompt + totalComp} توكن`,
            at: new Date().toISOString()
          });
        }

        const mRec = {
          id: Date.now() + 2,
          user_id: u.id,
          title: goal.slice(0, 65),
          mode: ui.missionMode,
          status: 'completed',
          output: finalOut,
          tokens: totalPrompt + totalComp,
          api_cost_usd: apiCostUsd,
          credits_charged: creditsCharged,
          steps: traceSteps,
          at: new Date().toISOString()
        };
        state.missions.unshift(mRec);
        ui.selectedMissionId = mRec.id;
        ui.busy = false;
        saveStore();
        flash(`اكتملت المهمة بنجاح (${mRec.tokens} توكن | خصم ${creditsCharged} نقطة).`);
      } catch (err) {
        ui.busy = false;
        flash('', err.message || 'فشل التنفيذ الفعلي.');
      }
    };

              </div>
            </div>

            <form onsubmit="addCustomTool(event)" class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
              <div class="font-bold text-sm">ربط أداة HTTP Webhook خارجية (يستدعيها الوكيل تلقائياً أثناء التفكير)</div>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <input id="ct_name" required placeholder="اسم الأداة (فحص المخزون)" class="px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)]" />
                <input id="ct_slug" required placeholder="inventory_api" dir="ltr" class="px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono" />
                <select id="ct_method" class="px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)]">
                  <option value="POST">POST</option>
                  <option value="GET">GET</option>
                </select>
                <input id="ct_url" type="url" required placeholder="https://api.example.com/hook" dir="ltr" class="px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono" />
              </div>
              <input id="ct_desc" required placeholder="وصف دقيق للنموذج متى يستدعي هذه الأداة..." class="w-full px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)]" />
              <button type="submit" class="px-4 py-2 rounded border border-[var(--border)] bg-[var(--background)] font-bold">+ إضافة الأداة لمساحتي</button>
            </form>
          </div>
        `;
      } else if (ui.tab === 'billing') {
        mainHtml = `
          <div class="space-y-6 text-xs">
            <div class="pb-4 border-b border-[var(--border)]">
              <h1 class="text-lg font-bold">الاشتراك الشهري، الفواتير، وقسائم الترقية الفورية</h1>
              <p class="text-xs text-[var(--muted-foreground)]">باقتك الحالية: <strong>${esc(pl.name_ar)}</strong> | الرصيد: <strong>${u.credits.toLocaleString()} cr</strong></p>
            </div>

            <form onsubmit="redeemVoucher(event)" class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] flex flex-wrap items-center gap-3">
              <div class="font-bold">تفعيل كود قسيمة فورية (جرب PRO2026 أو VIPSWARM):</div>
              <input id="voucher_input" required placeholder="VIPSWARM" dir="ltr" class="px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono uppercase" />
              <button type="submit" class="px-4 py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-bold">تفعيل القسيمة الآن</button>
            </form>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${state.plans.map(p => `
                <div class="p-4 rounded-xl bg-[var(--card)] border ${p.id === pl.id ? 'border-[var(--primary)]' : 'border-[var(--border)]'} flex flex-col justify-between gap-3">
                  <div class="space-y-1.5">
                    <div class="font-bold text-sm">${esc(p.name_ar)}</div>
                    <div class="text-lg font-bold font-mono" dir="ltr">$${p.price}/mo</div>
                    <div class="text-[var(--muted-foreground)]">+${p.credits.toLocaleString()} نقطة | حتى ${p.max_agents < 0 ? '∞' : p.max_agents} وكيل</div>
                  </div>
                  ${p.id === pl.id ? `<span class="py-1.5 text-center rounded bg-[var(--background)] font-bold text-[var(--success)]">الباقة النشطة حالياً</span>` : `
                    <button onclick="submitInvoiceRequest(${p.id})" class="py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-bold">طلب ترقية وإصدار فاتورة</button>
                  `}
                </div>
              `).join('')}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2">
                <div class="font-bold text-sm">سجل فواتيرك (${myInvoices.length})</div>
                ${myInvoices.length === 0 ? `<div class="text-[var(--muted-foreground)]">لا توجد فواتير صادرة بعد.</div>` : myInvoices.map(inv => `
                  <div class="p-2.5 rounded bg-[var(--background)] border border-[var(--border)] flex justify-between items-center">
                    <div>
                      <div class="font-bold font-mono">${esc(inv.inv_no)} — $${inv.amount_usd}</div>
                      <div class="text-[var(--muted-foreground)]">${esc(inv.plan_name)} | مرجع: ${esc(inv.reference)}</div>
                    </div>
                    <span class="font-bold ${inv.status === 'paid' ? 'text-[var(--success)]' : 'text-[var(--warning)]'}">${inv.status === 'paid' ? 'مدفوعة ومعتمدة' : 'بانتظار اعتماد المالك'}</span>
                  </div>
                `).join('')}
              </div>

              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2">
                <div class="font-bold text-sm">دفتر حركات المحفظة (${myTxs.length})</div>
                ${myTxs.slice(0, 6).map(tx => `
                  <div class="p-2.5 rounded bg-[var(--background)] border border-[var(--border)] flex justify-between items-center">
                    <span>${esc(tx.note)}</span>
                    <span class="font-mono font-bold ${tx.delta >= 0 ? 'text-[var(--success)]' : 'text-[var(--warning)]'}" dir="ltr">${tx.delta >= 0 ? '+' : ''}${tx.delta} cr</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (ui.tab === 'admin' && u.role === 'super_admin') {
        const totalProfit = state.txs.reduce((s, t) => s + Number(t.profit_usd || 0), 0);
        const totalApiCost = state.txs.reduce((s, t) => s + Number(t.api_cost_usd || 0), 0);
        const pendingInvs = state.invoices.filter(i => i.status === 'pending');

        mainHtml = `
          <div class="space-y-6 text-xs">
            <div class="pb-4 border-b border-[var(--border)] flex flex-wrap justify-between items-center gap-3">
              <div>
                <h1 class="text-lg font-bold">لوحة تحكم المالك المركزية (Super Admin SaaS Console)</h1>
                <p class="text-[var(--muted-foreground)]">إدارة محرك الذكاء الاصطناعي المركزي، هامش الربح، اعتماد فواتير المشتركين، وإصدار القسائم.</p>
              </div>
            </div>

            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-[var(--muted-foreground)]">إجمالي المشتركين</div>
                <div class="text-xl font-bold font-mono mt-1">${state.users.length}</div>
              </div>
              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-[var(--muted-foreground)]">صافي ربح المنصة</div>
                <div class="text-xl font-bold font-mono text-[var(--success)] mt-1" dir="ltr">$${totalProfit.toFixed(4)}</div>
              </div>
              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-[var(--muted-foreground)]">تكلفة المزود الفعلية</div>
                <div class="text-xl font-bold font-mono mt-1" dir="ltr">$${totalApiCost.toFixed(4)}</div>
              </div>
              <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)]">
                <div class="text-[var(--muted-foreground)]">فواتير بانتظار الاعتماد</div>
                <div class="text-xl font-bold font-mono text-[var(--warning)] mt-1">${pendingInvs.length}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <form onsubmit="saveAdminEngine(event)" class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-3">
                <div class="font-bold text-sm">إعداد محرك النماذج المركزي للمنصة ومعامل الربح</div>
                <div>
                  <label class="block mb-1 font-semibold">مزود النماذج المركزي</label>
                  <select id="adm_prov" class="w-full px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)]">
                    <option value="gemini" ${state.config.provider === 'gemini' ? 'selected' : ''}>Google Gemini API (AIza...)</option>
                    <option value="openrouter" ${state.config.provider === 'openrouter' ? 'selected' : ''}>OpenRouter (sk-or-...)</option>
                    <option value="openai" ${state.config.provider === 'openai' ? 'selected' : ''}>OpenAI Direct (sk-...)</option>
                  </select>
                </div>
                <div>
                  <label class="block mb-1 font-semibold">مفتاح API المركزي (يخدم جميع المشتركين ويحقق هامش الربح)</label>
                  <input id="adm_key" type="password" value="${esc(state.config.api_key || '')}" placeholder="الصق مفتاح Gemini أو OpenRouter أو OpenAI الحقيقي هنا..." dir="ltr" class="w-full px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono" />
                </div>
                <div class="grid grid-cols-2 gap-3 items-center">
                  <div>
                    <label class="block mb-1 font-semibold">معامل تسعير النقاط (Markup X)</label>
                    <input id="adm_markup" type="number" step="0.5" min="1" value="${state.config.markup_multiplier}" class="w-full px-3 py-2 rounded bg-[var(--background)] border border-[var(--border)] font-mono" />
                  </div>
                  <label class="flex items-center gap-2 pt-5 cursor-pointer">
                    <input id="adm_byok" type="checkbox" ${state.config.allow_byok ? 'checked' : ''} />
                    <span>السماح بمفاتيح العملاء BYOK</span>
                  </label>
                </div>
                <div class="flex gap-2 pt-1">
                  <button type="submit" class="px-4 py-2 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-bold">حفظ الإعدادات</button>
                  <button type="button" onclick="pingAdminLlm()" class="px-3 py-2 rounded border border-[var(--border)] bg-[var(--background)] font-semibold">اختبار الاتصال الفعلي (Ping)</button>
                </div>
              </form>

              <div class="space-y-4">
                <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2.5">
                  <div class="font-bold text-sm">طلبات الفواتير والتحويلات المالية (${state.invoices.length})</div>
                  ${state.invoices.length === 0 ? `<div class="text-[var(--muted-foreground)]">لا توجد فواتير مرفوعة من المشتركين حالياً.</div>` : state.invoices.map(inv => `
                    <div class="p-2.5 rounded bg-[var(--background)] border border-[var(--border)] flex justify-between items-center gap-2">
                      <div>
                        <div class="font-bold">${esc(inv.user_email)} — $${inv.amount_usd} (${esc(inv.plan_name)})</div>
                        <div class="text-[var(--muted-foreground)] font-mono">${esc(inv.inv_no)} | مرجع: ${esc(inv.reference)}</div>
                      </div>
                      ${inv.status === 'pending' ? `
                        <button onclick="adminApproveInvoice(${inv.id})" class="px-3 py-1.5 rounded bg-[var(--primary)] text-[var(--primary-foreground)] font-bold">اعتماد وترقية</button>
                      ` : `<span class="text-[var(--success)] font-bold">معتمدة</span>`}
                    </div>
                  `).join('')}
                </div>

                <form onsubmit="createAdminVoucher(event)" class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2.5">
                  <div class="font-bold text-sm">إصدار كود قسيمة اشتراك جديدة</div>
                  <div class="grid grid-cols-3 gap-2">
                    <input id="v_code" required placeholder="LAUNCH26" dir="ltr" class="px-2.5 py-1.5 rounded bg-[var(--background)] border border-[var(--border)] font-mono uppercase" />
                    <select id="v_plan" class="px-2 py-1.5 rounded bg-[var(--background)] border border-[var(--border)]">
                      <option value="2">باقة المحترفين</option>
                      <option value="3">باقة الشركات</option>
                      <option value="4">باقة المؤسسات</option>
                    </select>
                    <input id="v_credits" type="number" value="2500" class="px-2.5 py-1.5 rounded bg-[var(--background)] border border-[var(--border)] font-mono" />
                  </div>
                  <button type="submit" class="px-3 py-1.5 rounded border border-[var(--border)] bg-[var(--background)] font-bold">+ إنشاء القسيمة</button>
                </form>
              </div>
            </div>

            <div class="p-4 rounded-xl bg-[var(--card)] border border-[var(--border)] space-y-2">
              <div class="font-bold text-sm">قائمة حسابات المشتركين المسجلين (${state.users.length})</div>
              <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                  <thead>
                    <tr class="border-b border-[var(--border)] text-[var(--muted-foreground)]">
                      <th class="py-2">الاسم / البريد</th>
                      <th class="py-2">الصلاحية</th>
                      <th class="py-2">الباقة</th>
                      <th class="py-2">الرصيد المتاح</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.users.map(usr => {
                      const up = userPlan(usr);
                      return `
                        <tr class="border-b border-[var(--border)]">
                          <td class="py-2 font-semibold">${esc(usr.full_name)} <span class="font-mono text-[var(--muted-foreground)]">(${esc(usr.email)})</span></td>
                          <td class="py-2 font-mono">${esc(usr.role)}</td>
                          <td class="py-2">${esc(up.name_ar)}</td>
                          <td class="py-2 font-mono">${usr.credits.toLocaleString()} cr</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="grid grid-cols-1 md:grid-cols-12">
          <aside class="md:col-span-3 lg:col-span-3 p-4 bg-[var(--card)] border-b md:border-b-0 md:border-l border-[var(--border)] flex flex-col justify-between gap-6">
            <div class="space-y-4">
              <div class="pb-3 border-b border-[var(--border)]">
                <div class="font-bold text-sm">${esc(state.config.platform_name)}</div>
                <div class="text-xs text-[var(--muted-foreground)]">Multi-Tenant SaaS OS</div>
              </div>

              <div class="p-3 rounded-lg bg-[var(--background)] border border-[var(--border)] space-y-1 text-xs">
                <div class="flex justify-between items-center">
                  <span class="font-bold">${esc(u.full_name)}</span>
                  <span class="px-1.5 py-0.5 rounded bg-[var(--card)] font-mono">${u.role === 'super_admin' ? 'Admin' : 'Tenant'}</span>
                </div>
                <div class="font-mono text-[var(--muted-foreground)] truncate" dir="ltr">${esc(u.email)}</div>
                <div class="pt-1.5 mt-1.5 border-t border-[var(--border)] flex justify-between">
                  <span class="text-[var(--muted-foreground)]">الرصيد:</span>
                  <span class="font-mono font-bold text-[var(--success)]">${u.credits.toLocaleString()} cr</span>
                </div>
              </div>

              <nav class="space-y-1 text-xs font-semibold">
                <button onclick="ui.tab='dashboard';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md ${ui.tab === 'dashboard' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}">مساحة العمل</button>
                <button onclick="ui.tab='agents';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md flex justify-between ${ui.tab === 'agents' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}"><span>مصنع ومتجر الوكلاء</span><span class="font-mono">${myAgents.length}</span></button>
                <button onclick="ui.tab='missions';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md flex justify-between ${ui.tab === 'missions' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}"><span>غرفة العمليات (ReAct)</span><span class="font-mono">${myMissions.length}</span></button>
                <button onclick="ui.tab='tools';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md ${ui.tab === 'tools' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}">الأدوات ومفاتيح API</button>
                <button onclick="ui.tab='billing';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md ${ui.tab === 'billing' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}">الاشتراك والفواتير</button>
                ${u.role === 'super_admin' ? `
                  <button onclick="ui.tab='admin';ui.notice='';ui.error='';render()" class="w-full text-right px-3 py-2 rounded-md border border-[var(--border)] mt-2 ${ui.tab === 'admin' ? 'bg-[var(--primary)] text-[var(--primary-foreground)]' : 'hover:bg-[var(--background)]'}">لوحة المالك (Super Admin)</button>
                ` : ''}
              </nav>
            </div>

            <button onclick="doLogout()" class="w-full py-2 rounded-md border border-[var(--border)] text-xs font-bold text-[var(--error)] hover:bg-[var(--background)]">
              تسجيل الخروج وتبديل الحساب
            </button>
          </aside>

          <main class="md:col-span-9 lg:col-span-9 p-5 space-y-4">
            ${ui.error ? `<div class="p-3 rounded-lg border border-[var(--error)] text-[var(--error)] text-xs font-medium">${esc(ui.error)}</div>` : ''}
            ${ui.notice ? `<div class="p-3 rounded-lg border border-[var(--success)] text-[var(--success)] text-xs font-medium">${esc(ui.notice)}</div>` : ''}
            ${mainHtml}
          </main>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app');
      const u = currentUser();
      root.innerHTML = u ? renderWorkspace(u) : renderAuthGate();
    }

    initStore().then(render);
  </script>
</body>
</html>
